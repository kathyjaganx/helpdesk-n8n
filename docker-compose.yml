# =====================================================================
# Help Desk Local con n8n — Entorno Docker
# Autora: Irma Yaritza Katiuxca Jagan Xol (4090-23-9748)
#
# Todas las credenciales se leen del archivo .env (que NO se sube a Git).
# Los puertos se publican solo en 127.0.0.1: no son accesibles desde
# otros equipos de la red.
# =====================================================================

services:

  postgres:
    image: postgres:16
    container_name: helpdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Usados por db/init/01_init.sh para crear la BD de la aplicación
      HELPDESK_DB: ${HELPDESK_DB}
      HELPDESK_USER: ${HELPDESK_USER}
      HELPDESK_PASSWORD: ${HELPDESK_PASSWORD}
      TZ: ${GENERIC_TIMEZONE}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    # Versión fijada para que el proyecto sea reproducible.
    image: docker.n8n.io/n8nio/n8n:2.45.6
    container_name: helpdesk-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Base de datos interna de n8n (workflows, credenciales, ejecuciones)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Llave con la que n8n cifra las credenciales guardadas
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Zona horaria (afecta los Cron y las fechas de los reportes)
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}

      # Entorno 100% local
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

      # Los nodos de archivos solo pueden escribir en la carpeta de reportes
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/reportes

      # Conservar el historial de ejecuciones (evidencia de pruebas)
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 720
    volumes:
      - n8n_data:/home/node/.n8n
      - ./reportes:/home/node/reportes
    ports:
      - "127.0.0.1:5678:5678"

volumes:
  pg_data:
  n8n_data:
